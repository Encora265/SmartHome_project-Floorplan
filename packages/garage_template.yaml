###############################################################################
# 🏠 PACKAGE: Garage Virtual (per Sonoff Mini D a contatto pulito)
# Funziona con l’inching attivo su eWeLink.
# Gestisce apertura/chiusura con logica condizionata e stato tramite sensore.
###############################################################################

script:
  open_garage:
    alias: "Apri garage"
    sequence:
      - condition: state
        entity_id: binary_sensor.garage_contact
        state: "off"   # esegue solo se CHIUSO
      - service: switch.turn_on
        target:
          entity_id: switch.sonoff_100253c202_1
    mode: single

  close_garage:
    alias: "Chiudi garage"
    sequence:
      - condition: state
        entity_id: binary_sensor.garage_contact
        state: "on"    # esegue solo se APERTO
      - service: switch.turn_on
        target:
          entity_id: switch.sonoff_100253c202_1
    mode: single


cover:
  - platform: template
    covers:
      garage_virtual:
        device_class: garage
        friendly_name: "Garage"
        value_template: "{{ is_state('binary_sensor.garage_contact', 'on') }}"
        open_cover:
          service: script.open_garage
        close_cover:
          service: script.close_garage
        icon_template: >
          {% if is_state('binary_sensor.garage_contact', 'on') %}
            mdi:garage-open
          {% else %}
            mdi:garage
          {% endif %}


template:
  - sensor:
      - name: "Stato Garage"
        unique_id: garage_state_virtual
        state: >
          {% if is_state('binary_sensor.garage_contact', 'on') %}
            Aperto
          {% else %}
            Chiuso
          {% endif %}
        icon: >
          {% if is_state('binary_sensor.garage_contact', 'on') %}
            mdi:garage-open
          {% else %}
            mdi:garage
          {% endif %}


  - trigger:
      - platform: time_pattern
        seconds: "/1"
    sensor:
      - name: "refresher_1s"
        state: "{{ now().timestamp() }}"






